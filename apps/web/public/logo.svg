<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tracker logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8aff"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- three board columns -->
  <rect x="11" y="14" width="12" height="36" rx="3" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="26" y="14" width="12" height="36" rx="3" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="41" y="14" width="12" height="36" rx="3" fill="#ffffff" fill-opacity="0.28"/>
  <!-- cards: a short stack, a card in flight, a done card -->
  <rect x="13" y="17" width="8" height="7" rx="2" fill="#ffffff"/>
  <rect x="13" y="27" width="8" height="7" rx="2" fill="#ffffff"/>
  <rect x="28" y="17" width="8" height="7" rx="2" fill="#ffffff"/>
  <rect x="43" y="40" width="8" height="7" rx="2" fill="#ffffff"/>
  <!-- the moving card: tilted and lifted between columns -->
  <g transform="rotate(8 34 33)">
    <rect x="29" y="28" width="9" height="8" rx="2" fill="#ffffff" stroke="#4f46e5" stroke-width="1"/>
  </g>
  <!-- check mark on the last column -->
  <path d="M44.5 43.6l1.8 1.8 3.2-3.6" fill="none" stroke="#4f46e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
